const APPS=`function doPost(e){var L=LockService.getScriptLock();L.waitLock(20000);try{var d=JSON.parse(e.postData.contents),ss=SpreadsheetApp.getActiveSpreadsheet(),n={producto:'Productos',usuario:'Usuarios'}[d.tipo]||'Analisis',sh=ss.getSheetByName(n)||ss.insertSheet(n),f=d.fila,lc=sh.getLastColumn(),h=lc?sh.getRange(1,1,1,lc).getValues()[0]:[];Object.keys(f).forEach(function(k){if(h.indexOf(k)<0){h.push(k);sh.getRange(1,h.length).setValue(k)}});var row=h.map(function(k){return f[k]===undefined?'':f[k]}),r=0;if(f.id&&sh.getLastRow()>1){var ids=sh.getRange(2,h.indexOf('id')+1,sh.getLastRow()-1,1).getValues();for(var i=0;i<ids.length;i++){if(String(ids[i][0])==String(f.id)){r=i+2;break}}}if(r)sh.getRange(r,1,1,row.length).setValues([row]);else sh.appendRow(row);return out({ok:true})}finally{L.releaseLock()}}
